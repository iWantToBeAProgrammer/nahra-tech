<svg width="780" height="1600" viewBox="0 0 780 1600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- titanium/metal frame gradient, radial-ish via linear across width for edge highlight -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57595e"/>
      <stop offset="8%" stop-color="#2c2e32"/>
      <stop offset="50%" stop-color="#221f22"/>
      <stop offset="92%" stop-color="#2c2e32"/>
      <stop offset="100%" stop-color="#5a5c61"/>
    </linearGradient>
    <linearGradient id="frameGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63656a"/>
      <stop offset="4%" stop-color="#2c2e32"/>
      <stop offset="96%" stop-color="#2c2e32"/>
      <stop offset="100%" stop-color="#616367"/>
    </linearGradient>
    <radialGradient id="islandGrad" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1d1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="lensGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="55%" stop-color="#0b0c0d"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <filter id="dropShadowP" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#dropShadowP)">
    <!-- outer frame body, r=95 -->
    <path fill="url(#frameGrad)" fill-rule="evenodd" d="
      M 105 15
      H 675
      A 95 95 0 0 1 770 110
      V 1490
      A 95 95 0 0 1 675 1585
      H 105
      A 95 95 0 0 1 10 1490
      V 110
      A 95 95 0 0 1 105 15
      Z

      M 130 52
      H 650
      A 60 60 0 0 1 710 112
      V 1488
      A 60 60 0 0 1 650 1548
      H 130
      A 60 60 0 0 1 70 1488
      V 112
      A 60 60 0 0 1 130 52
      Z
    "/>

    <!-- vertical sheen overlay on the frame ring for metallic feel -->
    <path fill="url(#frameGradV)" fill-rule="evenodd" opacity="0.5" d="
      M 105 15
      H 675
      A 95 95 0 0 1 770 110
      V 1490
      A 95 95 0 0 1 675 1585
      H 105
      A 95 95 0 0 1 10 1490
      V 110
      A 95 95 0 0 1 105 15
      Z

      M 130 52
      H 650
      A 60 60 0 0 1 710 112
      V 1488
      A 60 60 0 0 1 650 1548
      H 130
      A 60 60 0 0 1 70 1488
      V 112
      A 60 60 0 0 1 130 52
      Z
    "/>

    <!-- inner bezel edge shadow around screen for depth -->
    <rect x="70" y="112" width="640" height="1436" rx="60"
          fill="none" stroke="#000000" stroke-width="3" opacity="0.4"/>

    <!-- dynamic island -->
    <rect x="295" y="72" width="190" height="48" rx="24" fill="url(#islandGrad)"/>
    <circle cx="450" cy="96" r="7" fill="url(#lensGrad)"/>
    <circle cx="425" cy="96" r="3.5" fill="#141a20" opacity="0.8"/>

    <!-- earpiece speaker (subtle, above island alt design) -->
    <!-- side buttons: mute switch + volume (left), power (right) -->
    <rect x="0" y="290" width="7" height="55" rx="3" fill="#1b1c1e"/>
    <rect x="0" y="370" width="7" height="95" rx="3" fill="#1b1c1e"/>
    <rect x="0" y="480" width="7" height="95" rx="3" fill="#1b1c1e"/>
    <rect x="773" y="400" width="7" height="150" rx="3" fill="#1b1c1e"/>

    <!-- button highlight edges -->
    <rect x="0" y="290" width="2" height="55" fill="#4a4c50" opacity="0.6"/>
    <rect x="778" y="400" width="2" height="150" fill="#4a4c50" opacity="0.6"/>

    <!-- bottom edge details: speaker grille + port -->
    <g opacity="0.55">
      <rect x="260" y="1578" width="6" height="6" rx="1.5" fill="#0b0c0d"/>
      <rect x="272" y="1578" width="6" height="6" rx="1.5" fill="#0b0c0d"/>
      <rect x="284" y="1578" width="6" height="6" rx="1.5" fill="#0b0c0d"/>
      <rect x="330" y="1577" width="120" height="9" rx="4.5" fill="#0b0c0d"/>
      <rect x="500" y="1578" width="6" height="6" rx="1.5" fill="#0b0c0d"/>
      <rect x="512" y="1578" width="6" height="6" rx="1.5" fill="#0b0c0d"/>
      <rect x="524" y="1578" width="6" height="6" rx="1.5" fill="#0b0c0d"/>
    </g>
  </g>
</svg>
