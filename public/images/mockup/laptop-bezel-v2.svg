<svg width="1700" height="1120" viewBox="0 0 1700 1120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- brushed aluminum lid gradient -->
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b4e54"/>
      <stop offset="6%" stop-color="#3a3d43"/>
      <stop offset="50%" stop-color="#232529"/>
      <stop offset="94%" stop-color="#1c1e21"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <!-- side edge highlight for lid, thin light rim -->
    <linearGradient id="lidRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6e74"/>
      <stop offset="100%" stop-color="#26282c"/>
    </linearGradient>
    <!-- keyboard deck gradient (top light catches, bottom darker) -->
    <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57595e"/>
      <stop offset="15%" stop-color="#45474c"/>
      <stop offset="100%" stop-color="#2a2c2f"/>
    </linearGradient>
    <linearGradient id="deckFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26282b"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <radialGradient id="camLens" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3a4550"/>
      <stop offset="60%" stop-color="#0c0d0f"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- soft drop shadow under whole device -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- subtle inner shadow ring hugging the screen edge -->
    <filter id="innerEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- ===== SCREEN LID ===== -->
    <!-- outer lid body -->
    <path fill="url(#lidGrad)" fill-rule="evenodd" d="
      M 90 20
      H 1610
      A 30 30 0 0 1 1640 50
      V 930
      A 30 30 0 0 1 1610 960
      H 90
      A 30 30 0 0 1 60 930
      V 50
      A 30 30 0 0 1 90 20
      Z

      M 158 82
      H 1542
      A 8 8 0 0 1 1550 90
      V 892
      A 8 8 0 0 1 1542 900
      H 158
      A 8 8 0 0 1 150 892
      V 90
      A 8 8 0 0 1 158 82
      Z
    "/>

    <!-- thin light rim along outer top edge for aluminum highlight -->
    <path fill="none" stroke="url(#lidRim)" stroke-width="2" opacity="0.5" d="
      M 92 22 H 1608 A 28 28 0 0 1 1638 50
    "/>

    <!-- inner bezel edge shadow (very subtle ring around the screen hole for depth) -->
    <rect x="150" y="90" width="1400" height="810" rx="8"
          fill="none" stroke="#000000" stroke-width="3" opacity="0.35"/>

    <!-- camera housing + lens -->
    <circle cx="850" cy="55" r="6.5" fill="url(#camLens)"/>
    <circle cx="850" cy="55" r="9" fill="none" stroke="#3a3d43" stroke-width="1" opacity="0.6"/>

    <!-- ambient light sensor hint -->
    <rect x="800" y="50" width="10" height="4" rx="2" fill="#0c0d0f" opacity="0.7"/>

    <!-- hinge bar -->
    <rect x="60" y="960" width="1580" height="22" fill="#101113"/>
    <rect x="60" y="960" width="1580" height="4" fill="#38393c" opacity="0.5"/>

    <!-- ===== KEYBOARD BASE / DECK ===== -->
    <path fill="url(#deckGrad)" d="
      M 20 982
      L 1680 982
      L 1680 1052
      L 1620 1052
      L 1595 1084
      A 20 20 0 0 1 1580 1092
      H 120
      A 20 20 0 0 1 105 1084
      L 80 1052
      L 20 1052
      Z
    "/>
    <!-- front lip of the base (thickness) -->
    <path fill="url(#deckFront)" d="
      M 80 1052 L 105 1084 A 20 20 0 0 0 120 1092 H 1580 A 20 20 0 0 0 1595 1084 L 1620 1052 Z
    "/>

    <!-- keyboard key rows (subtle, decorative) -->
    <g opacity="0.55">
      <rect x="180" y="1000" width="1340" height="8" rx="4" fill="#17181a"/>
      <rect x="180" y="1016" width="1340" height="8" rx="4" fill="#17181a"/>
      <rect x="180" y="1032" width="1340" height="8" rx="4" fill="#17181a"/>
    </g>

    <!-- trackpad -->
    <rect x="700" y="1000" width="300" height="45" rx="6" fill="#1c1e21" opacity="0.5" stroke="#3a3d43" stroke-width="1"/>

    <!-- speaker grille hints near hinge -->
    <g opacity="0.4">
      <circle cx="300" cy="972" r="2.5" fill="#0c0d0f"/>
      <circle cx="315" cy="972" r="2.5" fill="#0c0d0f"/>
      <circle cx="330" cy="972" r="2.5" fill="#0c0d0f"/>
      <circle cx="1370" cy="972" r="2.5" fill="#0c0d0f"/>
      <circle cx="1385" cy="972" r="2.5" fill="#0c0d0f"/>
      <circle cx="1400" cy="972" r="2.5" fill="#0c0d0f"/>
    </g>
  </g>
</svg>
