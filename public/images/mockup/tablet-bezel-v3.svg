<svg width="1240" height="1660" viewBox="0 0 1240 1660" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tframeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5c61"/>
      <stop offset="6%" stop-color="#2e3033"/>
      <stop offset="50%" stop-color="#232527"/>
      <stop offset="94%" stop-color="#2e3033"/>
      <stop offset="100%" stop-color="#5d5f64"/>
    </linearGradient>
    <linearGradient id="tframeGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65676c"/>
      <stop offset="4%" stop-color="#2e3033"/>
      <stop offset="96%" stop-color="#2e3033"/>
      <stop offset="100%" stop-color="#63656a"/>
    </linearGradient>
    <radialGradient id="tlensGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="55%" stop-color="#0b0c0d"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <filter id="dropShadowT" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <g>
    <!-- outer body r=75. Bezel tipis: sisi ~16px, atas ~24px, bawah ~16px -->
    <path fill="url(#tframeGrad)" fill-rule="evenodd" d="
      M 90 15
      H 1150
      A 75 75 0 0 1 1225 90
      V 1570
      A 75 75 0 0 1 1150 1645
      H 90
      A 75 75 0 0 1 15 1570
      V 90
      A 75 75 0 0 1 90 15
      Z

      M 89 39
      H 1151
      A 14 14 0 0 1 1165 53
      V 1591
      A 14 14 0 0 1 1151 1605
      H 89
      A 14 14 0 0 1 75 1591
      V 53
      A 14 14 0 0 1 89 39
      Z
    "/>

    <path fill="url(#tframeGradV)" fill-rule="evenodd" opacity="0.45" d="
      M 90 15
      H 1150
      A 75 75 0 0 1 1225 90
      V 1570
      A 75 75 0 0 1 1150 1645
      H 90
      A 75 75 0 0 1 15 1570
      V 90
      A 75 75 0 0 1 90 15
      Z

      M 89 39
      H 1151
      A 14 14 0 0 1 1165 53
      V 1591
      A 14 14 0 0 1 1151 1605
      H 89
      A 14 14 0 0 1 75 1591
      V 53
      A 14 14 0 0 1 89 39
      Z
    "/>

    <!-- inner bezel edge shadow around thinner screen hole -->
    <rect x="75" y="53" width="1090" height="1538" rx="14"
          fill="none" stroke="#000000" stroke-width="2.5" opacity="0.38"/>

    <!-- front camera, centered in thin top bezel band (15 to 39 = 24px) -->
    <circle cx="620" cy="27" r="6" fill="url(#tlensGrad)"/>
    <circle cx="620" cy="27" r="8.5" fill="none" stroke="#3d3f43" stroke-width="1" opacity="0.5"/>

    <!-- side buttons, repositioned within thinner side bezel band (1209 to 1225 = 16px) -->
    <rect x="1213" y="180" width="5" height="70" rx="2.5" fill="#1b1c1e"/>
    <rect x="1213" y="270" width="5" height="130" rx="2.5" fill="#1b1c1e"/>

    <!-- speaker grilles, repositioned within thin side bands -->
    <g opacity="0.5">
      <circle cx="23" cy="200" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="214" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="228" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="242" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="1400" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="1414" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="1428" r="2" fill="#0b0c0d"/>
      <circle cx="23" cy="1442" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="200" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="214" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="228" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="242" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="1400" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="1414" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="1428" r="2" fill="#0b0c0d"/>
      <circle cx="1217" cy="1442" r="2" fill="#0b0c0d"/>
    </g>
  </g>
</svg>
