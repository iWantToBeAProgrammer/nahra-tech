<svg width="1240" height="1660" viewBox="0 0 1240 1660" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tframeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a5c61"/>
      <stop offset="6%" stop-color="#2e3033"/>
      <stop offset="50%" stop-color="#232527"/>
      <stop offset="94%" stop-color="#2e3033"/>
      <stop offset="100%" stop-color="#5d5f64"/>
    </linearGradient>
    <linearGradient id="tframeGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65676c"/>
      <stop offset="4%" stop-color="#2e3033"/>
      <stop offset="96%" stop-color="#2e3033"/>
      <stop offset="100%" stop-color="#63656a"/>
    </linearGradient>
    <radialGradient id="tlensGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="55%" stop-color="#0b0c0d"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <filter id="dropShadowT" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <g filter="url(#dropShadowT)">
    <!-- outer body r=75 -->
    <path fill="url(#tframeGrad)" fill-rule="evenodd" d="
      M 90 15
      H 1150
      A 75 75 0 0 1 1225 90
      V 1570
      A 75 75 0 0 1 1150 1645
      H 90
      A 75 75 0 0 1 15 1570
      V 90
      A 75 75 0 0 1 90 15
      Z

      M 100 66
      H 1140
      A 18 18 0 0 1 1158 84
      V 1576
      A 18 18 0 0 1 1140 1594
      H 100
      A 18 18 0 0 1 82 1576
      V 84
      A 18 18 0 0 1 100 66
      Z
    "/>

    <!-- vertical sheen for metallic feel -->
    <path fill="url(#tframeGradV)" fill-rule="evenodd" opacity="0.45" d="
      M 90 15
      H 1150
      A 75 75 0 0 1 1225 90
      V 1570
      A 75 75 0 0 1 1150 1645
      H 90
      A 75 75 0 0 1 15 1570
      V 90
      A 75 75 0 0 1 90 15
      Z

      M 100 66
      H 1140
      A 18 18 0 0 1 1158 84
      V 1576
      A 18 18 0 0 1 1140 1594
      H 100
      A 18 18 0 0 1 82 1576
      V 84
      A 18 18 0 0 1 100 66
      Z
    "/>

    <!-- inner bezel edge shadow -->
    <rect x="82" y="84" width="1076" height="1510" rx="18"
          fill="none" stroke="#000000" stroke-width="3" opacity="0.38"/>

    <!-- front camera -->
    <circle cx="620" cy="42" r="7" fill="url(#tlensGrad)"/>
    <circle cx="620" cy="42" r="10" fill="none" stroke="#3d3f43" stroke-width="1" opacity="0.5"/>

    <!-- side buttons (volume + power) on right edge -->
    <rect x="1219" y="180" width="6" height="70" rx="3" fill="#1b1c1e"/>
    <rect x="1219" y="270" width="6" height="130" rx="3" fill="#1b1c1e"/>

    <!-- speaker grilles top and bottom, both sides -->
    <g opacity="0.5">
      <circle cx="55" cy="200" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="215" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="230" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="245" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="1400" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="1415" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="1430" r="2.2" fill="#0b0c0d"/>
      <circle cx="55" cy="1445" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="200" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="215" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="230" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="245" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="1400" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="1415" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="1430" r="2.2" fill="#0b0c0d"/>
      <circle cx="1185" cy="1445" r="2.2" fill="#0b0c0d"/>
    </g>
  </g>
</svg>
